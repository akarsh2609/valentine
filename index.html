<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For My Valentine ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<audio id="bg-music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<section id="unlock">
  <h1>🔐 Answer this to unlock 💖</h1>
  <p>What is my favourite mithai? 🍬</p>
  <input type="text" id="answer" placeholder="Type here...">
  <button id="unlock-btn">Unlock</button>
  <p id="error"></p>
</section>

<section id="game" class="hidden">
  <h1>🧠 Match the memories 💕</h1>
  <div id="game-board"></div>
</section>

<section id="question" class="hidden">
  <h1>Will you be my Valentine? 💘</h1>
  <div class="gif-placeholder" id="gif-placeholder">[ Add cute gif here ]</div>
  <button id="yes-btn">YES 💖</button>
  <button id="no-btn">NO 💔</button>
  <p id="no-text"></p>
</section>

<div id="valentine-response" class="hidden">
  <h2>🥰 So happy you said YES!</h2>
</div>

<script src="script.js"></script>
</body>
</html>
